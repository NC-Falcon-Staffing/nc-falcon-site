# =============================================================
# NC Falcon — Site Editor configuration (Decap CMS)
# Auth: DecapBridge (PKCE). Editors log in at /admin with Google
# or a password; DecapBridge commits to GitHub on their behalf.
# =============================================================

backend:
  name: git-gateway
  repo: NC-Falcon-Staffing/nc-falcon-site
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/8c3bd649-71e3-457b-945e-028010c8a069/pkce
  auth_token_endpoint: /sites/8c3bd649-71e3-457b-945e-028010c8a069/token
  gateway_url: https://gateway.decapbridge.com
  # Commits record who made the change
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via site editor'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via site editor'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via site editor'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via site editor'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via site editor'

# Maps the PKCE login details onto the editor's profile
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Shown on the login screen and in the editor header
logo_url: /images/falcon-logo-web.png

# Puts a "View site" link in the editor
site_url: https://ncfalconstaffing.com

# Where uploaded photos are stored
media_folder: "images/uploads"
public_folder: "/images/uploads"

# No live preview pane (keeps the editor simple)
editor:
  preview: false

collections:
  # ----------------------------------------------------------
  # PUBLISH
  # Saving anything else parks the change in GitHub without deploying.
  # Saving THIS is what pushes the site live. See scripts/netlify-should-build.sh
  # and "Publishing" in README.md.
  # ----------------------------------------------------------
  - name: "publish"
    label: "🚀 Publish Site"
    description: "Your edits are saved but not live yet. Open this and press Save to push everything you've changed onto the real website."
    files:
      - name: "publish"
        label: "Publish Site"
        file: "content/publish.json"
        fields:
          - label: "Publish date & time"
            name: "last_published"
            widget: "datetime"
            format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]"
            picker_utc: true
            hint: "Set this to right now, then press Save. That is what makes your changes go live."
          - label: "What changed?"
            name: "note"
            widget: "string"
            hint: "A few words for your own records, e.g. 'new phone number and two testimonials'. Changing this also lets you press Save."

  # ----------------------------------------------------------
  # SITE-WIDE SETTINGS
  # ----------------------------------------------------------
  - name: "settings"
    label: "⚙️ Contact Info & Footer"
    description: "Email addresses, phone, location, and the footer text shown on every page."
    files:
      - name: "site"
        label: "Contact Info & Footer"
        file: "content/settings.json"
        fields:
          - { label: "General Email", name: "email_general", widget: "string" }
          - { label: "Careers Email", name: "email_careers", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string", hint: "Shown on the Contact page. Example: (704) 555-0123" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Location (Español)", name: "location_es", widget: "string", required: false }
          - { label: "Service Area", name: "service_area", widget: "string" }
          - { label: "Service Area (Español)", name: "service_area_es", widget: "string", required: false }
          - { label: "Response Time", name: "response_time", widget: "string" }
          - { label: "Response Time (Español)", name: "response_time_es", widget: "string", required: false }
          - label: "Show the Gallery page"
            name: "show_gallery"
            widget: "boolean"
            default: false
            required: false
            hint: "Leave OFF until you have real jobsite photos. When OFF, the Gallery link is hidden from the menu and footer everywhere on the site. Turn it ON once you have added photos below."
          - { label: "Footer Description", name: "footer_description", widget: "text" }
          - { label: "Footer Description (Español)", name: "footer_description_es", widget: "text", required: false }
          - { label: "Footer Motto", name: "footer_motto", widget: "string" }
          - { label: "Footer Motto (Español)", name: "footer_motto_es", widget: "string", required: false }

  # ----------------------------------------------------------
  # GALLERY
  # ----------------------------------------------------------
  - name: "gallery"
    label: "📸 Gallery Photos"
    description: "Add, remove, and reorder the photos on the Gallery page. Drag items to reorder."
    files:
      - name: "gallery"
        label: "Gallery Page"
        file: "content/gallery.json"
        fields:
          - label: "Page Heading"
            name: "page_head"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Title (Español)", name: "title_es", widget: "string", required: false }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Intro (Español)", name: "intro_es", widget: "text", required: false }
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.caption}}"
            hint: "Click 'Add Photos', upload a picture, and write a short caption. Drag to reorder."
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string" }
              - { label: "Caption (Español)", name: "caption_es", widget: "string", required: false }
          - label: "Bottom Banner"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Title (Español)", name: "title_es", widget: "string", required: false }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Text (Español)", name: "text_es", widget: "text", required: false }
              - { label: "Orange Button Label", name: "primary_button", widget: "string" }
              - { label: "Orange Button Label (Español)", name: "primary_button_es", widget: "string", required: false }
              - { label: "Outline Button Label", name: "secondary_button", widget: "string" }
              - { label: "Outline Button Label (Español)", name: "secondary_button_es", widget: "string", required: false }

  # ----------------------------------------------------------
  # TESTIMONIALS
  # ----------------------------------------------------------
  - name: "testimonials"
    label: "💬 Testimonials"
    description: "Quotes from contractors and electricians, shown on the home page. Leave empty to hide the section."
    files:
      - name: "testimonials"
        label: "Testimonials"
        file: "content/testimonials.json"
        fields:
          - label: "Section Heading"
            name: "section"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small Label", name: "eyebrow", widget: "string" }
              - { label: "Small Label (Español)", name: "eyebrow_es", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Title (Español)", name: "title_es", widget: "string", required: false }
          - label: "Testimonials"
            name: "items"
            widget: "list"
            summary: "{{fields.author}}"
            hint: "The home page shows these in order. Delete all of them to hide the whole section."
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Quote (Español)", name: "quote_es", widget: "text", required: false }
              - { label: "Name", name: "author", widget: "string" }
              - { label: "Name (Español)", name: "author_es", widget: "string", required: false }
              - { label: "Role / Company", name: "role", widget: "string", required: false, hint: "Example: Project Manager, ABC Electric" }
              - { label: "Role / Company (Español)", name: "role_es", widget: "string", required: false }

  # ----------------------------------------------------------
  # PAGES
  # ----------------------------------------------------------
  - name: "pages"
    label: "📄 Page Text"
    description: "The words on each page of the site."
    files:
      - name: "home"
        label: "Home Page"
        file: "content/home.json"
