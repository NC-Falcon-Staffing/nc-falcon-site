<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>NC Falcon — Site Editor</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
</head>
<body>
  <!-- Decap CMS: the admin panel loads entirely from this script. -->
  <!-- Pinned deliberately. A floating range (^3.0.0) means any release lands
       on the live editor unannounced. PKCE login needs >= 3.8.3.
       To upgrade: bump this number, deploy, then log in and confirm it works. -->
  <!-- integrity= is the sha384 of the 3.15.1 bundle. If unpkg ever serves
       different bytes under this version, the browser refuses to run them.
       This editor can commit to GitHub, so a swapped bundle would be serious.
       When you bump the version above you MUST regenerate this hash or the
       editor will refuse to load:
         curl -sL https://unpkg.com/decap-cms@<version>/dist/decap-cms.js \
           | openssl dgst -sha384 -binary | openssl base64 -A -->
  <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"
          integrity="sha384-in6eHztHveqQ7uMZ1fDaKlDmacQLFuLH2wWrFTiymyuS8zQ5bixwL8U3AeRi8h/L"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"></script>
</body>
</html>
