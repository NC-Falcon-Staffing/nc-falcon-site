# Netlify configuration for the NC Falcon site
[build]
  publish = "."
  # Decides whether a push is worth a deploy. See scripts/netlify-should-build.sh
  # and "Publishing" in README.md. Exit 0 = skip the build, exit 1 = build.
  ignore = "bash scripts/netlify-should-build.sh"

# Don't cache content files so edits show up right away
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

# publish = "." serves every committed file, so any document in the repo is
# reachable by URL. This returns 404 instead. Working notes live in
# _local-docs/ and are never committed, so they need no rule here.
# Netlify only allows "*" at the END of a path, so "/*.md" matches nothing
# and each file must be listed explicitly.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

# Build helpers. Never needed by a browser.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Security headers
#
# One policy covers the whole site including /admin. Netlify merges every
# matching [[headers]] block, and two Content-Security-Policy headers on one
# response are intersected by the browser, so a second stricter block for the
# public pages would silently break the editor. Keep it as one policy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Force HTTPS for a year. Deliberately no "includeSubDomains" and no
    # "preload": both are hard to undo and would break any future subdomain
    # that isn't on HTTPS. Add them only if you're sure.
    Strict-Transport-Security = "max-age=31536000"

    # The site needs none of these. Denying them stops an injected script
    # from quietly asking for them.
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

    Cross-Origin-Opener-Policy = "same-origin"

    # 'unsafe-inline' and 'unsafe-eval' are here because Decap CMS needs them
    # and the pages carry inline JSON-LD. The real value of this policy is the
    # rest of it: scripts and network calls can only reach this origin plus the
    # four hosts the editor talks to, so injected code has nowhere to send
    # anything. See "Security headers" in README.md before loosening it.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://auth.decapbridge.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://auth.decapbridge.com https://gateway.decapbridge.com https://api.github.com https://unpkg.com; frame-src 'self' https://auth.decapbridge.com; worker-src 'self' blob:; upgrade-insecure-requests"
