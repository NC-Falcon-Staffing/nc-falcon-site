# Netlify configuration for the NC Falcon site
[build]
  publish = "."

# Don't cache content files so edits show up right away
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

# publish = "." serves every committed file, so any document in the repo is
# reachable by URL. This returns 404 instead. Working notes live in
# _local-docs/ and are never committed, so they need no rule here.
# Netlify only allows "*" at the END of a path, so "/*.md" matches nothing
# and each file must be listed explicitly.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
